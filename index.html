<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Photo Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LANDING PAGE -->
<section id="landing">
  <header class="topbar">
    <h1 class="logo">AI Image Editor</h1>
    <button class="login">Log in</button>
  </header>

  <div class="hero">
    <h2>Free Online Photo Editor</h2>
    <p>
      Upload, edit, and enhance your photos instantly —  
      all in one simple, powerful editor.
    </p>

    <label class="upload-btn">
      ⬆ Upload your image
      <input type="file" id="upload" hidden accept="image/*">
    </label>
  </div>
</section>

<!-- EDITOR PAGE -->
<section id="editor" class="hidden">
  <header class="editor-top">
    <span>AI Image Editor</span>
    <button onclick="resetEditor()">New Image</button>
  </header>

  <main class="editor-layout">
    <div class="canvas-area">
      <canvas id="canvas"></canvas>
    </div>

    <div class="tools">
      <h3>Adjust</h3>
      <label>Brightness</label>
      <input type="range" id="brightness" min="0" max="200" value="100">

      <label>Contrast</label>
      <input type="range" id="contrast" min="0" max="200" value="100">

      <button onclick="download()">Download</button>
    </div>
  </main>
</section>

<script src="script.js"></script>
</body>
</html>
