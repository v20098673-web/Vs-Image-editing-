<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Image Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <header>
        <h1>🖼️ Image Editor Pro</h1>
        <input type="file" id="upload" accept="image/*">
    </header>

    <main>
        <div class="image-area">
            <img id="preview">
        </div>

        <aside class="panel">
            <h3>Adjust</h3>

            <label>Brightness</label>
            <input type="range" id="brightness" min="0" max="200" value="100">

            <label>Contrast</label>
            <input type="range" id="contrast" min="0" max="200" value="100">

            <label>Saturation</label>
            <input type="range" id="saturate" min="0" max="200" value="100">

            <label>Blur</label>
            <input type="range" id="blur" min="0" max="10" value="0">

            <label>Grayscale</label>
            <input type="range" id="grayscale" min="0" max="100" value="0">

            <label>Sepia</label>
            <input type="range" id="sepia" min="0" max="100" value="0">

            <h3>Transform</h3>
            <div class="btn-group">
                <button onclick="rotate(-90)">⟲ Rotate</button>
                <button onclick="rotate(90)">⟳ Rotate</button>
                <button onclick="flipX()">⇋ Flip X</button>
                <button onclick="flipY()">⇅ Flip Y</button>
            </div>

            <h3>Presets</h3>
            <div class="btn-group">
                <button onclick="preset('vintage')">Vintage</button>
                <button onclick="preset('bw')">B&W</button>
                <button onclick="preset('cool')">Cool</button>
                <button onclick="preset('warm')">Warm</button>
            </div>

            <div class="actions">
                <button class="reset" onclick="resetAll()">Reset</button>
                <button class="download" onclick="downloadImage()">Download</button>
            </div>
        </aside>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
